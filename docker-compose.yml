services:
  scalp-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: moex-scalp-live

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

    ports:
      - "3012:3011"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3011/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
